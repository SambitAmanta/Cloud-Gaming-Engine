# /etc/X11/xorg.conf for Headless Game Streaming with Dummy Video Driver
Section "ServerLayout"
    Identifier     "Layout0"
    Screen      0  "Screen0"
    InputDevice    "DummyInput" "CorePointer"
EndSection

Section "Files"
    ModulePath "/usr/lib/xorg/modules"
EndSection

Section "InputDevice"
    Identifier  "DummyInput"
    Driver      "void"
EndSection

Section "Device"
    Identifier  "Configured Video Device"
    Driver      "dummy"
    VideoRam    256000
EndSection

Section "Monitor"
    Identifier  "Configured Monitor"
    HorizSync   30.0 - 85.0
    VertRefresh 50.0 - 120.0
    Modeline    "1920x1080_60.00" 173.00 1920 2048 2248 2576 1080 1083 1088 1120 -hsync +vsync
    Modeline    "1280x720_60.00"   74.50 1280 1344 1472 1664  720  723  728  748 -hsync +vsync
EndSection

Section "Screen"
    Identifier  "Screen0"
    Device      "Configured Video Device"
    Monitor     "Configured Monitor"
    DefaultDepth 24
    SubSection "Display"
        Viewport 0 0
        Depth    24
        Modes    "1920x1080" "1280x720"
    EndSubSection
EndSection

